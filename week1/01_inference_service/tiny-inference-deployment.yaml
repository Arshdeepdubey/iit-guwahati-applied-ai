apiVersion: apps/v1
kind: Deployment
metadata:
  name: tiny-inference
  labels:
    app: tiny-inference
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tiny-inference
  template:
    metadata:
      labels:
        app: tiny-inference
    spec:
      containers:
        - name: tiny-inference
          image: tiny-inference:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: tiny-inference-svc
spec:
  selector:
    app: tiny-inference
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP

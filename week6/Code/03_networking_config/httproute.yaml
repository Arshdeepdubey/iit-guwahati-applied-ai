# The ML team self-serves this in their own namespace -- no
# cluster-admin access needed, unlike classic Ingress (Session 2,
# slide 4, 6).
#
# Apply:  kubectl apply -f httproute.yaml
# Check:  kubectl get httproute -n team-alpha llm-inference-route

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: llm-inference-route
  namespace: team-alpha
spec:
  parentRefs:
    - name: inference-gateway
  rules:
    - matches:
        - path:
            value: /v1/completions
      backendRefs:
        - name: llm-service
          port: 8080

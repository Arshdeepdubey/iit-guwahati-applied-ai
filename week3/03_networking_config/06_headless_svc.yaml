# Headless Service: clusterIP: None means no virtual IP is allocated.
# DNS for this Service name returns the pod IPs directly, and each pod
# of the owning StatefulSet additionally gets its own stable hostname
# record: <pod-name>.<service-name> (Session 2, slides 2-3).
#
# This is the backbone of distributed training: NCCL rendezvous needs
# every worker to address every other worker by a stable hostname.
# A regular ClusterIP Service would make all workers resolve to the
# same virtual IP, and NCCL would hang at initialization.
#
# Apply:  kubectl apply -f 06_headless_svc.yaml

apiVersion: v1
kind: Service
metadata:
  name: training-worker
spec:
  clusterIP: None
  selector:
    app: training-worker
  ports:
    - name: nccl
      port: 29500
      targetPort: 29500
